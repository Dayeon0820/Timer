<!doctype html>
<!--
  공유 미리보기 이미지(Open Graph) 원본 - 1200×630
  문구를 바꾼 뒤 branding/generate.mjs 로 public/og-image.png 를 다시 만든다.
  색은 src/styles/tokens.css 의 값을 그대로 사용한다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Pretendard Variable';
        src: url('../node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2');
        font-weight: 45 920;
      }
      :root {
        --sage-25: #f7f9f3;
        --sage-50: #f1f5ee;
        --sage-100: #e6eee2;
        --sage-200: #d3e2cd;
        --sage-400: #92b38a;
        --sage-700: #3b6343;
        --sage-900: #1f3626;
        --ink: #1d2b22;
        --text-2: #56665b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--sage-50);
        font-family: 'Pretendard Variable', sans-serif;
        color: var(--ink);
        position: relative;
      }
      /* 배경의 부드러운 원형 장식 */
      .blob {
        position: absolute;
        border-radius: 50%;
        background: var(--sage-100);
      }
      .b1 {
        width: 520px;
        height: 520px;
        left: -200px;
        bottom: -260px;
      }
      .b2 {
        width: 300px;
        height: 300px;
        right: -90px;
        top: -120px;
      }
      .wrap {
        position: relative;
        display: flex;
        align-items: center;
        gap: 72px;
        height: 100%;
        padding: 0 88px;
      }
      /* 왼쪽: 링 + 마스코트 + 시간 */
      .ring-box {
        position: relative;
        flex: none;
        width: 400px;
        height: 400px;
        margin-top: 40px;
      }
      .ring-box svg.ring {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .mascot {
        position: absolute;
        left: 50%;
        top: -64px;
        transform: translateX(-50%);
      }
      .time {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .time b {
        font-size: 104px;
        font-weight: 760;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .time span {
        font-size: 24px;
        color: var(--text-2);
        font-weight: 500;
      }
      /* 오른쪽: 제목 + 설명 + 기능 칩 */
      .copy {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .eyebrow {
        display: inline-flex;
        align-self: flex-start;
        padding: 8px 18px;
        border-radius: 999px;
        background: var(--sage-200);
        color: var(--sage-700);
        font-size: 22px;
        font-weight: 700;
      }
      h1 {
        font-size: 84px;
        font-weight: 850;
        letter-spacing: -0.04em;
        line-height: 1.05;
        color: var(--sage-700);
      }
      p.desc {
        font-size: 30px;
        line-height: 1.45;
        color: var(--text-2);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 6px;
      }
      .chips span {
        padding: 10px 20px;
        border-radius: 999px;
        background: var(--sage-25);
        border: 2px solid var(--sage-200);
        font-size: 22px;
        font-weight: 650;
        color: var(--ink);
      }
      .note {
        font-size: 20px;
        color: var(--text-2);
        display: flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="wrap">
      <div class="ring-box">
        <svg class="ring" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="88" fill="none" stroke="#e6eee2" stroke-width="8" />
          <circle
            cx="100"
            cy="100"
            r="88"
            fill="none"
            stroke="#3b6343"
            stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="552.9"
            stroke-dashoffset="138"
          />
        </svg>
        <!-- 마스코트 "새싹떡" (src/components/ui/Mascot.jsx 와 같은 모양) -->
        <svg class="mascot" width="150" height="121" viewBox="0 0 124 100">
          <path d="M62 24v-10" fill="none" stroke="#3b6343" stroke-width="3" stroke-linecap="round" />
          <path d="M62 15c-4-8-12-10-17-7 3 7 10 9 17 7zM62 15c4-8 12-10 17-7-3 7-10 9-17 7z" fill="#d3e2cd" stroke="#3b6343" stroke-width="3" />
          <path d="M12 94C12 50 34 24 62 24s50 26 50 70z" fill="#d3e2cd" stroke="#3b6343" stroke-width="3" stroke-linejoin="round" />
          <ellipse cx="37" cy="68" rx="6" ry="3.5" fill="#3b6343" opacity="0.18" />
          <ellipse cx="87" cy="68" rx="6" ry="3.5" fill="#3b6343" opacity="0.18" />
          <circle cx="48" cy="58" r="4" fill="#3b6343" />
          <circle cx="76" cy="58" r="4" fill="#3b6343" />
          <path d="M56 66q6 6 12 0" fill="none" stroke="#3b6343" stroke-width="3" stroke-linecap="round" />
          <ellipse cx="32" cy="92" rx="12" ry="9" fill="#f7f9f3" stroke="#3b6343" stroke-width="3" />
          <ellipse cx="92" cy="92" rx="12" ry="9" fill="#f7f9f3" stroke="#3b6343" stroke-width="3" />
        </svg>
        <div class="time">
          <b>25:00</b>
          <span>집중할 시간이에요!</span>
        </div>
      </div>

      <div class="copy">
        <span class="eyebrow">웹캠 AI 뽀모도로</span>
        <h1>집중 타이머</h1>
        <p class="desc">졸거나 딴짓하면 타이머가 멈추고<br />다시 화면을 보면 이어서 흘러가요</p>
        <div class="chips">
          <span>😴 졸음 감지</span>
          <span>👀 딴짓 감지</span>
          <span>🕒 시간대별 분석</span>
        </div>
        <p class="note">🔒 설치 없이 브라우저에서 · 영상은 기기 밖으로 나가지 않아요</p>
      </div>
    </div>
  </body>
</html>
