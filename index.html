<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 기본 정보 (%VITE_SITE_URL% 은 .env 의 사이트 주소로 빌드 시 바뀜) -->
    <title>집중 타이머 · 웹캠 졸음·딴짓 감지 뽀모도로</title>
    <meta
      name="description"
      content="졸거나 딴짓하면 타이머가 멈추고, 다시 화면을 보면 이어서 흘러가는 뽀모도로 타이머. 시간대별 집중 분석까지. 설치 없이 브라우저에서, 영상은 기기 밖으로 나가지 않아요."
    />
    <meta name="keywords" content="뽀모도로, 공부 타이머, 집중 타이머, 졸음 감지, 웹캠, 스터디, 집중력" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f1f5ee" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- 파비콘 & 홈 화면 아이콘 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="집중 타이머" />
    <meta name="application-name" content="집중 타이머" />

    <!-- 공유 미리보기: Open Graph (카카오톡, 페이스북, 슬랙, 디스코드 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="집중 타이머" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="집중 타이머 · 졸면 멈추는 뽀모도로" />
    <meta
      property="og:description"
      content="웹캠으로 졸음과 딴짓을 감지해 집중이 깨지면 타이머가 자동으로 멈춰요. 설치 없이 브라우저에서, 영상은 기기 밖으로 나가지 않아요."
    />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="새싹 마스코트가 25:00 타이머 위에 앉아 있는 집중 타이머 소개 이미지" />

    <!-- 공유 미리보기: X(트위터) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="집중 타이머 · 졸면 멈추는 뽀모도로" />
    <meta name="twitter:description" content="웹캠으로 졸음과 딴짓을 감지해 집중이 깨지면 타이머가 자동으로 멈춰요." />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.png" />
    <meta name="twitter:image:alt" content="새싹 마스코트가 25:00 타이머 위에 앉아 있는 집중 타이머 소개 이미지" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
